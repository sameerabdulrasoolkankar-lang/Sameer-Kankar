<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8f0fe;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 300px;
      padding: 20px;
      border-radius: 15px;
      background: #222;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    #display {
      width: 100%;
      height: 60px;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
      border: none;
      border-radius: 8px;
      font-size: 28px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 52px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover { background: #666; }
    .operator { background: #f39c12; }
    .operator:hover { background: #d68910; }
    .clear { background: #e74c3c; }
    .equal { background: #27ae60; }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="addToDisplay('%')">%</button>
      <button class="operator" onclick="addToDisplay('/')">÷</button>

      <button onclick="addToDisplay('7')">7</button>
      <button onclick="addToDisplay('8')">8</button>
      <button onclick="addToDisplay('9')">9</button>
      <button class="operator" onclick="addToDisplay('*')">×</button>

      <button onclick="addToDisplay('4')">4</button>
      <button onclick="addToDisplay('5')">5</button>
      <button onclick="addToDisplay('6')">6</button>
      <button class="operator" onclick="addToDisplay('-')">−</button>

      <button onclick="addToDisplay('1')">1</button>
      <button onclick="addToDisplay('2')">2</button>
      <button onclick="addToDisplay('3')">3</button>
      <button class="operator" onclick="addToDisplay('+')">+</button>

      <button onclick="addToDisplay('0')">0</button>
      <button onclick="addToDisplay('.')">.</button>
      <button class="equal" style="grid-column: span 2" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function addToDisplay(value) {
      if (display.value === '0') display.value = '';
      display.value += value;
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1) || '0';
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
